spring.application.name=claims

# Postgres (docker-compose, host port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/claims
spring.datasource.username=claims
spring.datasource.password=claims

# Schema is owned by Flyway migrations; Hibernate only checks it matches
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Kafka (docker-compose, KRaft single node)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=claims
spring.kafka.consumer.auto-offset-reset=earliest

management.endpoints.web.exposure.include=health
